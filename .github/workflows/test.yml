name: Python smoke tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GUI and pronunciation-matcher libraries
        run: python -m pip install "customtkinter>=5.2.2,<6" "Pillow>=10.3,<12" "numpy>=1.26,<2"
      - name: Install speech backend for actual model check
        if: runner.os == 'Windows'
        run: python -m pip install vosk==0.3.45
      - name: Download and load actual Russian Vosk model on Windows
        if: runner.os == 'Windows'
        run: python download_model.py
      - name: Check source syntax
        run: python -m compileall -q src tests download_model.py
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Check Windows raw line endings
        if: runner.os == 'Windows'
        run: python tests/check_batch.py
      - name: Smoke-test Windows batch launchers
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call install.bat --self-test
          if errorlevel 1 exit /b 1
          call run.bat --self-test
          if errorlevel 1 exit /b 1
          call install-voice-id.bat --self-test
          if errorlevel 1 exit /b 1

      - name: Validate Python detection with broken launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir "%TEMP%\hvc-fake-py"
          > "%TEMP%\hvc-fake-py\py.cmd" echo @echo off
          >> "%TEMP%\hvc-fake-py\py.cmd" echo echo [ERROR] No runtime installed that matches 3.11.
          >> "%TEMP%\hvc-fake-py\py.cmd" echo exit /b 0
          set "PATH=%TEMP%\hvc-fake-py;%PATH%"
          call install.bat --check-python
          if errorlevel 1 exit /b 1

      - name: Verify desktop GUI imports
        env:
          PYTHONPATH: src
        run: python -c "from hogwarts_voice.ui import App, Wizard; print('GUI imports OK')"

      - name: Smoke-test actual desktop window construction
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: src
        run: python tests/smoke_desktop.py
