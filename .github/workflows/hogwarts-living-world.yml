name: Hogwarts Living World - tests and Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - 'hogwarts-living-world/**'
      - '.github/workflows/hogwarts-living-world.yml'
  pull_request:
    paths:
      - 'hogwarts-living-world/**'
      - '.github/workflows/hogwarts-living-world.yml'

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hogwarts-living-world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (no keys or network access required)
        run: python -m unittest discover -s tests -v

  windows-build:
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hogwarts-living-world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EXE packager
        run: python -m pip install "pyinstaller>=6.11,<7"
      - name: Build standalone Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --name HogwartsLivingWorld start.py
      - name: Pack distribution
        shell: pwsh
        run: |
          New-Item -Path package -ItemType Directory | Out-Null
          Copy-Item dist/HogwartsLivingWorld.exe package/
          Copy-Item run.bat package/
          Copy-Item README.md package/
          Copy-Item SONORUS_SETUP.md package/
          Copy-Item demo-story.ps1 package/
          Compress-Archive -Path package/* -DestinationPath HogwartsLivingWorld-0.2.0-win64.zip -Force
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: HogwartsLivingWorld-0.2.0-win64
          path: hogwarts-living-world/HogwartsLivingWorld-0.2.0-win64.zip
          if-no-files-found: error
